# If you are using a dongle, custom ZMK configuration options should go in this
# file. If you are not using a dongle (using the left as central), this file is
# ignored.

# KVM rear KEYBOARD port fix: most KVM HID ports expect a USB boot-protocol
# keyboard. ZMK disables boot protocol by default (CONFIG_ZMK_USB_BOOT=n).
CONFIG_ZMK_USB_BOOT=y
